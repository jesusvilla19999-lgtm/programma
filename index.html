<style>
/* Layout: one column "foglio di servizio" — week bar, person picker, day strip, then turno blocks of activity rows */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#18212b; --muted:#5b6774; --line:#d6dce3; --soft:#e4e9ef;
  --accent:#c98a07; --accent-ink:#4a3300; --accent-soft:#fbefd2;
  --tM:#d99a12; --tP:#1f8a83; --tN:#3f4fa8; --tG:#6c7a89; --tMD:#a35a8a;
  --me:#fff4cf; --me-line:#e2b23c; --danger:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --paper:#192029; --ink:#e7ecf1; --muted:#9aa6b2; --line:#2c3642; --soft:#222b35;
  --accent:#f0b43a; --accent-ink:#f7d58c; --accent-soft:#3a2f17;
  --tM:#f0b43a; --tP:#3fbdb4; --tN:#8b98f0; --tG:#9aa6b2; --tMD:#d690bf;
  --me:#3a3218; --me-line:#c9982e; --danger:#f2867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --paper:#192029; --ink:#e7ecf1; --muted:#9aa6b2; --line:#2c3642; --soft:#222b35;
  --accent:#f0b43a; --accent-ink:#f7d58c; --accent-soft:#3a2f17;
  --tM:#f0b43a; --tP:#3fbdb4; --tN:#8b98f0; --tG:#9aa6b2; --tMD:#d690bf;
  --me:#3a3218; --me-line:#c9982e; --danger:#f2867d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 .wk{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.daytab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=number]{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daytab{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.daytab .dn{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daytab .dd{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.daytab .dot{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.daytab.has .dot{background:var(--accent)}
.daytab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daytab[aria-selected="true"] .dn{color:var(--bg);opacity:.75}
.daytab.today{box-shadow:inset 0 -3px 0 var(--accent)}
.turno{display:flex;flex-direction:column;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.turno-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.tbadge{font-family:var(--display);font-weight:700;font-size:15px;min-width:34px;height:26px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:var(--tG);letter-spacing:.03em}
.tbadge.M{background:var(--tM);color:#2a1d00}.tbadge.P{background:var(--tP)}.tbadge.N{background:var(--tN)}.tbadge.MD{background:var(--tMD)}
.turno-h .tn{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
.turno-h .ts{font-family:var(--mono);font-size:12px;color:var(--muted)}
.turno-h .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.act{padding:11px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.act:first-of-type{border-top:0}
.act.mine{background:var(--me);box-shadow:inset 4px 0 0 var(--me-line)}
.act .what{font-weight:600;min-width:0;overflow-wrap:anywhere}
.act .what.none{font-weight:400;font-style:italic;color:var(--muted)}
.act .odl{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;overflow-wrap:anywhere;max-width:16em}
.act .who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.act .note{grid-column:1/-1;font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:4px 8px;justify-self:start}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip.me{background:var(--accent);border-color:var(--accent);color:#2a1d00;font-weight:600}
.empty{color:var(--muted);padding:12px 14px;font-size:14px}
.myday{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.myday .dcol{background:var(--soft);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px}
.myday.today .dcol{background:var(--accent-soft)}
.myday .dcol .dn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.myday .dcol .dd{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.myday .items{display:flex;flex-direction:column;min-width:0}
.mi{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.mi:first-child{border-top:0}
.mi .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.mi .what{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mi .odl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mi .with{font-size:14px;color:var(--muted)}
.mi .with b{color:var(--ink);font-weight:500}
.free{padding:14px;color:var(--muted);font-style:italic}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--danger)}
.preview{border:2px dashed var(--accent);background:var(--paper)}
.preview h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:13px;color:var(--muted);margin:6px 0 12px}
.kv b{color:var(--ink);font-weight:500}
.warn{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted)}
.blank{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.blank h2{font-family:var(--display);font-size:26px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .tbadge{min-width:26px;height:20px;font-size:12px}
@media (max-width:520px){.act{grid-template-columns:minmax(0,1fr)}.act .odl{text-align:left;max-width:none}.myday{grid-template-columns:58px minmax(0,1fr)}.daytab .dd{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.act,.mi{transition:background .2s}}
</style>
<style>
body{margin:0}
[hidden]{display:none!important}
.pwrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:6px 0 10px}
input[type=password]{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;max-width:320px;height:auto;flex:none}
.pwrow > input[type=password]{flex:1 1 160px}
.pwrow .field{flex:0 1 320px}
.loading{padding:30px 16px;text-align:center;color:var(--muted)}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.netbar{font-size:13px;border-radius:8px;padding:8px 12px;background:var(--soft);color:var(--muted)}
.install{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.install p{margin:0;font-size:14px;min-width:0;flex:1 1 220px}
#findQ{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;flex:1 1 200px;min-width:0;font:inherit;color:inherit}
.findbox{display:flex;flex-direction:column;gap:8px}
.together{font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.findsum{font-size:14px;color:var(--muted);margin:0}
.seg{flex-wrap:wrap}
#viewBar .seg button{padding:8px 11px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:8px}
.calm{font-size:17px;min-width:9.5em;text-align:center}
#calPsel{flex:1 1 180px;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.cday{min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.cday .n{font-weight:600;font-size:14px;line-height:1}
.cday .cnt{font-size:11px;color:var(--muted)}
.cday.nodata{background:transparent;color:var(--muted);border-style:dashed}
.cday.work{background:var(--accent-soft);border-color:var(--accent)}
.cday.today .n{color:var(--accent)}
.cday.today{box-shadow:inset 0 -3px 0 var(--accent)}
.cday[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.cday .tb{display:flex;flex-wrap:wrap;gap:2px}
.cday .tbadge{min-width:0;height:16px;padding:0 3px;font-size:10px;border-radius:3px;font-style:normal}
.calleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.calleg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.calleg .lw{background:var(--accent-soft);border:1px solid var(--accent)}
.calleg .ln{border:1px dashed var(--line)}
.modtag{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:6px}
.cday.tr{background:rgba(214,69,65,.2);border-color:#d64541}
.cday.trv{background:repeating-linear-gradient(135deg,rgba(214,69,65,.16) 0 5px,transparent 5px 10px);border:1px dashed #d64541}
.calleg .ltr{background:rgba(214,69,65,.2);border:1px solid #d64541}
.calleg .ltv{border:1px dashed #d64541;background:repeating-linear-gradient(135deg,rgba(214,69,65,.2) 0 3px,transparent 3px 6px)}
.trtag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid #d64541}
.trtag.si{background:rgba(214,69,65,.16)}
.trtag.val{border-style:dashed}
.varbox{gap:8px;background:var(--soft)}
.varrow{padding-top:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.6fr) auto;gap:6px;align-items:center}
.varrow input,#varT{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
@media (max-width:560px){.varrow{grid-template-columns:minmax(0,1fr) auto}.varrow input{grid-column:1}.varrow button{grid-column:2;grid-row:1}}
.varbox label{display:flex;flex-direction:column;gap:4px}
.varch{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.varch .del{color:#c0392b}
.varch .warn{color:#c0392b;font-weight:600}
.varch .add,.varch .set{font-weight:600}
.btn.small{padding:4px 10px;font-size:13px}
.calform{gap:8px}
.calform label{display:flex;flex-direction:column;gap:4px}
.calform input,.calform textarea,.calform select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-transform:none;letter-spacing:0;font-weight:400}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">UM TE Udine · Programma attività</div>
      <h1 id="title">Programma settimanale</h1>
    </div>
    <div class="bar">
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <button class="btn primary" id="uploadBtn" type="button">Carica PDF della settimana</button>
    </div>
  </header>

  <div id="installBox" class="install" hidden>
    <p id="installText">Installa l'app sul telefono per aprirla con un tocco, anche senza rete.</p>
    <span class="bar"><button class="btn primary" type="button" id="installBtn" hidden>Installa app</button><button class="btn" type="button" id="installClose">Chiudi</button></span>
  </div>
  <div id="netbar" class="netbar" hidden></div>
  <div id="status" class="status" role="status"></div>

  <section id="previewBox" class="panel preview" hidden></section>

  <section class="panel" id="controls">
    <div class="bar">
      <div class="field">
        <label for="weekSel">Settimana</label>
        <select id="weekSel"></select>
      </div>
      <div class="field">
        <label for="personSel">Chi sei</label>
        <select id="personSel"></select>
      </div>
    </div>
  </section>

  <div class="bar" id="viewBar">
    <div class="seg" role="group" aria-label="Vista">
      <button type="button" id="vMine" aria-pressed="true">La mia settimana</button>
      <button type="button" id="vAll" aria-pressed="false">Programma completo</button>
      <button type="button" id="vFind" aria-pressed="false">Cerca</button>
      <button type="button" id="vCal" aria-pressed="false">Calendario</button>

    <div class="legend" aria-hidden="true">
      <span><i class="tbadge M">M</i>Mattina</span>

      <span><i class="tbadge N">N</i>Notte</span>

  <main id="main"><div class="loading">Caricamento…</div></main>

    <div class="bar" style="justify-content:space-between">
      <span class="hint" id="metaLine"></span>
      <span class="bar">
        <button class="btn danger" type="button" id="delBtn">Elimina questa settimana</button>
      </span>
    </div>
    <div id="delBox" hidden>
      <div class="pwrow">
        <input type="password" id="delPw" placeholder="Password" autocomplete="current-password">
        <button class="btn danger" type="button" id="delConfirm">Conferma eliminazione</button>
        <button class="btn" type="button" id="delCancel">Annulla</button>
      </div>
    </div>
  </section>
</div>

<script>
// Lettura del PDF del programma
async function parseProgramma(pdfjsLib, data){
  const doc = await pdfjsLib.getDocument({data, isEvalSupported:false, verbosity:0}).promise;
  const days = [];
  for (let pn=1; pn<=doc.numPages; pn++){
    const page = await doc.getPage(pn);
    const H = page.view[3];
    // rectangles (table cells / borders)
    const ol = await page.getOperatorList();
    const O = pdfjsLib.OPS, rects = [];
    // posizione corrente (tiene conto di eventuali scale/spostamenti del disegno)
    let ctm=[1,0,0,1,0,0]; const stack=[];
    const mul=(m,n)=>[m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
    const pt=(x,y)=>[ctm[0]*x+ctm[2]*y+ctm[4], ctm[1]*x+ctm[3]*y+ctm[5]];
    for (let i=0;i<ol.fnArray.length;i++){
      const fn=ol.fnArray[i];
      if (fn===O.save){ stack.push(ctm); continue; }
      if (fn===O.restore){ ctm=stack.pop()||[1,0,0,1,0,0]; continue; }
      if (fn===O.transform){ ctm=mul(ctm, ol.argsArray[i]); continue; }
      if (fn!==O.constructPath) continue;
      const [ops, args] = ol.argsArray[i]; let k=0;
      for (const op of ops){
        if (op===O.rectangle){ const [x,y,w,h]=args.slice(k,k+4); k+=4;
          const a=pt(x,y), b=pt(x+w,y+h);
          const x0=Math.min(a[0],b[0]), x1=Math.max(a[0],b[0]), y0=Math.min(a[1],b[1]), y1=Math.max(a[1],b[1]);
          rects.push({x0,x1,top:H-y1,bot:H-y0});
        } else if (op===O.moveTo||op===O.lineTo) k+=2;
        else if (op===O.curveTo) k+=6; else if (op===O.curveTo2||op===O.curveTo3) k+=4;
      }
    }
    const tc = await page.getTextContent();
    const items = tc.items.filter(it=>it.str && it.str.trim()).map(it=>{
      const t=it.transform, size=Math.hypot(t[2],t[3])||Math.hypot(t[0],t[1]);
      const rot = Math.abs(t[1])>0.01;
      return {s:it.str.replace(/\s+/g,' ').trim(), x:t[4], x1:t[4]+(rot?0:it.width), y:H-t[5]-(rot?0:size*0.35), base:H-t[5], rot, size};
    });
    // locate header columns
    const hdr = n=>items.find(i=>i.s.toLowerCase().startsWith(n));
    const hT=hdr('turno'), hA=hdr('attivit'), hO=hdr('odl'), hP=hdr('personale'), hN=hdr('note');
    if(!hA||!hP) continue;
    const headerY = hA.y;
    // column x-boundaries from vertical rect edges
    const vx = [...new Set(rects.filter(r=>r.x1-r.x0<1.5 && r.bot-r.top>3).map(r=>Math.round((r.x0+r.x1)/2)))].sort((a,b)=>a-b);
    const leftOf = x=>{let b=null;for(const v of vx) if(v<=x+0.5) b=v; return b;};
    const rightOf = x=>{for(const v of vx) if(v>x+0.5) return v; return null;};

    const colT = leftOf(hT? hT.x : colA-20);
    const dayL = leftOf(colT-1) ?? 0;
    const bounds = (xa,xb)=>{ // horizontal boundaries of cells spanning [xa,xb]
      const ys=[]; for(const r of rects){ if(r.bot-r.top<1.5 && r.x0<=xa+1 && r.x1>=xb-1 && r.bot>headerY){ ys.push(r.top, r.bot);} }

    };

    const inCell=(y,c)=>y>=c[0]-0.5&&y<=c[1]+0.5;
    for(const dc of dayCells){
      const lab = items.filter(i=>i.x<colT && inCell(i.y,dc)).sort((a,b)=>b.base-a.base);

      for(const tcell of turnoCells.filter(t=>t[0]>=dc[0]-1 && t[1]<=dc[1]+1)){
        const tl = items.filter(i=>!i.rot && i.x>=colT-3 && i.x<colA-1 && inCell(i.y,tcell)).sort((a,b)=>a.y-b.y||a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
        const attivita=[];
        for(const rc of rowCells.filter(r=>r[0]>=tcell[0]-1 && r[1]<=tcell[1]+1)){
          const its = items.filter(i=>!i.rot && i.x>=colA-1 && inCell(i.y,rc));
          if(!its.length) continue;
          const join=a=>a.sort((p,q)=>p.y-q.y||p.x-q.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
          const att = join(its.filter(i=>i.x<(colO??colP)-0.5));
          const odl = colO!=null? join(its.filter(i=>i.x>=colO-0.5 && i.x<colP-0.5)) : '';

        }
        if(!tl && !attivita.length) continue;
        day.turni.push({turno: tl || '—', attivita});
      }

      days.push(day);
    }
  }

}

document.addEventListener('change',function(e){ if(e.target.id==='varT' && S.cal && S.cal.vari){ S.cal.vari.turno=e.target.value; var rec=calMap()[S.cal.vari.key]; if(rec && $('varPrev')) $('varPrev').innerHTML=varPrevHtml(rec); } });
function renderCal(){
  calInit();
  var map=calMap(), p=calP(), set={};
  Object.keys(map).forEach(function(k){ people(map[k].w).forEach(function(x){ set[x]=1; }); });
  if(p) set[p]=1;
  var ps=Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'it'); });
  var head='<div class="panel findbox"><div class="calhead"><div class="calnav"><button class="btn" type="button" data-cal="-1" aria-label="Mese precedente">‹</button><strong class="calm">'+MESI_L[S.cal.m]+' '+S.cal.y+'</strong><button class="btn" type="button" data-cal="1" aria-label="Mese successivo">›</button></div>'+
    '<select id="calPsel" aria-label="Persona"><option value="">— tutte le persone —</option>'+ps.map(function(x){ return '<option'+(x===p?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</select></div>';
  var first=new Date(Date.UTC(S.cal.y,S.cal.m,1)), lead=(first.getUTCDay()+6)%7, n=new Date(Date.UTC(S.cal.y,S.cal.m+1,0)).getUTCDate();
  var t=new Date(), todayKey=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())).toISOString().slice(0,10);
  var cells=['L','M','M','G','V','S','D'].map(function(x){ return '<span class="wd">'+x+'</span>'; });
  for(var k=0;k<lead;k++) cells.push('<span></span>');
  var worked=0, ntr=0, nval=0;
  for(var d=1; d<=n; d++){
    var key=S.cal.y+'-'+('0'+(S.cal.m+1)).slice(-2)+'-'+('0'+d).slice(-2), rec=map[key], cls='cday', inner='';
    if(!rec) cls+=' nodata';
    else {
      var it=calItems(rec.w,rec.i,p);
      if(p && it.length){ cls+=' work'; worked++; if(inNucleo(p)){ var dk=trDay(it); if(dk==='si'){ cls+=' tr'; ntr++; } else if(dk==='val'){ cls+=' trv'; nval++; } }
        var ks={}; it.forEach(function(x){ ks[turnoInfo(x.t.turno).k]=1; });
        inner='<span class="tb">'+Object.keys(ks).map(function(q){ return '<i class="tbadge '+q+'">'+q+'</i>'; }).join('')+'</span>';
      } else if(!p && it.length) inner='<span class="cnt">'+it.length+'</span>';
    }
    if(key===todayKey) cls+=' today';
    cells.push('<button type="button" class="'+cls+'" data-cd="'+key+'" aria-pressed="'+(S.cal.sel===key)+'"><span class="n">'+d+'</span>'+inner+'</button>');
  }
  var sum = S.cal.loading ? 'Carico le settimane del mese…' :
    (p ? esc(p)+': '+worked+(worked===1?' giorno lavorato':' giorni lavorati')+' in '+MESI_L[S.cal.m].toLowerCase()+(inNucleo(p)?' · '+ntr+' in trasferta'+(nval?' · '+nval+' da valutare':''):'') : 'Scegli una persona per vedere i suoi giorni lavorati.');
  var leg='<div class="calleg"><span><i class="lw"></i>Giorno lavorato</span><span><i class="ln"></i>Programma non caricato</span>'+(inNucleo(p)?'<span><i class="ltr"></i>Trasferta</span><span><i class="ltv"></i>Da valutare</span>':'')+'</div>';
  return head+'<p class="findsum">'+sum+'</p><div class="cal">'+cells.join('')+'</div>'+leg+'</div>'+calDetail(map,p);
}
function calDetail(map,p){
  var key=S.cal.sel; if(!key) return '';
  var dt=new Date(key+'T00:00:00Z'), title=GIORNI[(dt.getUTCDay()+6)%7]+' '+dt.getUTCDate()+' '+MESI_L[dt.getUTCMonth()].toLowerCase();
  var rec=map[key];
  if(!rec) return '<div class="panel"><h2 class="eyebrow" style="margin:0 0 6px">'+title+'</h2><p class="hint" style="margin:0">Il programma di questa settimana non è caricato.</p></div>';
  var it=calItems(rec.w,rec.i,p), ed=S.cal.edit;
  var rows=it.map(function(x){
    if(ed && ed.key===key && ed.ti===x.ti && ed.ai===x.ai) return calForm(rec,x);
    var ti=turnoInfo(x.t.turno), a=x.a, others=a.persone.filter(function(q){ return q!==p; });
    var info=[ti.nome+(ti.sub?' '+ti.sub:''), a.odl?'OdL '+a.odl:''].filter(Boolean).join(' · ');
    return '<div class="mi"><div class="row1"><span class="tbadge '+ti.k+'" title="'+esc(ti.nome)+'">'+ti.k+'</span><span class="what">'+esc(a.attivita||'Attività non indicata')+'</span></div>'+
      '<div class="row1"><span class="odl">'+esc(info)+'</span>'+(a.mod?'<span class="modtag">modificato</span>':'')+'</div>'+(inNucleo(p)?trTag(a):'')+
      '<div class="with">'+(p?(others.length?'Con: '+others.map(function(q){ return '<b>'+esc(q)+'</b>'; }).join(', '):'Da solo'):a.persone.map(esc).join(', '))+'</div>'+
      (a.note?'<div class="act" style="padding:0;border:0"><div class="note">'+esc(a.note)+'</div></div>':'')+
      '<div><button class="btn small" type="button" data-ced="'+x.ti+'|'+x.ai+'">✎ Modifica</button></div></div>';
  }).join('');
  if(ed && ed.key===key && ed.ai<0) rows+=calForm(rec,null);
  var empty = !it.length && !(ed && ed.key===key) ? '<div class="mi"><div class="free">'+(p?esc(p)+' non compare nel programma di questo giorno':'Nessuna attività in questo giorno')+'</div></div>' : '';
  return '<div class="myday"><div class="dcol"><span class="dn">'+esc(GIORNI[(dt.getUTCDay()+6)%7].slice(0,3))+'</span><span class="dd">'+dt.getUTCDate()+'</span></div><div class="items">'+
    '<div class="mi"><strong>'+title+'</strong></div>'+rows+empty+
    (ed && ed.key===key ? '' : '<div class="mi"><div><button class="btn" type="button" data-ced="new">+ Aggiungi attività</button> <button class="btn" type="button" data-cvar="1">📷 Variazione da screenshot</button></div></div>')+varPanel(key,rec)+'</div></div>';
}
function calForm(rec,x){
  var g=rec.w.giorni[rec.i], a=x?x.a:{attivita:'',odl:'',persone:calP()?[calP()]:[],note:''};
  var labels=g.turni.map(function(t){ return t.turno; });
  ['Turno M','Turno P','Turno N'].forEach(function(l){ if(!labels.some(function(z){ return turnoInfo(z).k===turnoInfo(l).k; })) labels.push(l); });
  var curT = x ? x.t.turno : labels[0];
  var savedPw=lsGet('umte_pw');
  return '<div class="mi calform">'+
    '<label class="eyebrow">Turno<select id="cfT">'+labels.map(function(l){ var ti=turnoInfo(l); return '<option value="'+esc(l)+'"'+(l===curT?' selected':'')+'>'+esc(ti.nome+(ti.sub?' '+ti.sub:''))+'</option>'; }).join('')+'</select></label>'+
    '<label class="eyebrow">Attività<textarea id="cfA" rows="2">'+esc(a.attivita)+'</textarea></label>'+
    '<label class="eyebrow">OdL<input id="cfO" value="'+esc(a.odl)+'"></label>'+
    '<label class="eyebrow">Persone (separate da virgola)<input id="cfP" value="'+esc(a.persone.join(', '))+'"></label>'+
    '<label class="eyebrow">Note<input id="cfN" value="'+esc(a.note||'')+'"></label>'+
    '<label class="eyebrow">Trasferta<select id="cfTr"><option value="">Automatica'+(function(){ var t=trAuto(a); return t.k==='si'?' (sì · '+esc(t.why)+')':t.k==='val'?' (da valutare · '+esc(t.why)+')':' (no)'; })()+'</option><option value="si"'+(a.trasf==='si'?' selected':'')+'>Sì, è trasferta</option><option value="no"'+(a.trasf==='no'?' selected':'')+'>No, non è trasferta</option></select></label>'+(savedPw?'':'<label class="eyebrow">Password per salvare<input type="password" id="cfPw" autocomplete="current-password"></label>')+
    '<div class="bar"><button class="btn primary" type="button" data-cact="save">Salva</button><button class="btn" type="button" data-cact="cancel">Annulla</button>'+(x?'<button class="btn danger" type="button" data-cact="del">Elimina</button>':'')+'</div></div>';
}
function calSave(del){
  var ed=S.cal.edit, rec=calMap()[ed.key]; if(!rec) return;
  var pw=lsGet('umte_pw') || ($('cfPw')&&$('cfPw').value) || '';
  if(!pw){ setStatus('Inserisci la password per salvare.', true); if($('cfPw')) $('cfPw').focus(); return; }
  var w=JSON.parse(JSON.stringify(rec.w)), g=w.giorni[rec.i];
  if(ed.ai>=0) g.turni[ed.ti].attivita.splice(ed.ai,1);
  if(!del){
    var lab=$('cfT').value, t=g.turni.filter(function(z){ return z.turno===lab; })[0];
    if(!t){ t={turno:lab, attivita:[]}; g.turni.push(t); }
    var a={attivita:$('cfA').value.trim(), odl:$('cfO').value.trim(), persone:$('cfP').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean), note:$('cfN').value.trim(), mod:new Date().toISOString()}; if($('cfTr') && $('cfTr').value) a.trasf=$('cfTr').value;
    if(ed.ai>=0 && ed.ti<g.turni.length && g.turni[ed.ti].turno===lab) g.turni[ed.ti].attivita.splice(ed.ai,0,a); else t.attivita.push(a);
  }
  setStatus('Salvataggio in corso…');
  server('saveWeek', pw, JSON.stringify(w)).then(function(id){
    lsSet('umte_pw', pw); S.cache[id]=w; S.cal.edit=null;
    setStatus(del?'Attività eliminata.':'Modifica salvata.'); render();
  }).catch(function(e){
    var m=errMsg(e); if(/password/i.test(m)) lsSet('umte_pw','');
    setStatus('Salvataggio non riuscito: '+m, true); render();
  });
}
function calClick(e){
  if(varClick(e)) return true;
  var c=e.target.closest('[data-cal],[data-cd],[data-ced],[data-cact]'); if(!c) return false;
  if(c.dataset.cal){ S.cal.m+=+c.dataset.cal; if(S.cal.m<0){ S.cal.m=11; S.cal.y--; } if(S.cal.m>11){ S.cal.m=0; S.cal.y++; } S.cal.sel=null; S.cal.edit=null; render(); }
  else if(c.dataset.cd){ S.cal.sel = S.cal.sel===c.dataset.cd ? null : c.dataset.cd; S.cal.edit=null; render(); }
  else if(c.dataset.ced){ var v=c.dataset.ced; S.cal.edit = v==='new' ? {key:S.cal.sel,ti:-1,ai:-1} : {key:S.cal.sel,ti:+v.split('|')[0],ai:+v.split('|')[1]}; render(); }
  else if(c.dataset.cact==='cancel'){ S.cal.edit=null; render(); }
  else if(c.dataset.cact==='save') calSave(false);
  else if(c.dataset.cact==='del'){ if(confirm('Eliminare questa attività dal programma?')) calSave(true); }
  return true;
}
function render(){
  renderWeekSel(); renderPersonSel();
  var w=cur(); var main=$('main');
  $('vMine').setAttribute('aria-pressed', S.view==='mine'); $('vAll').setAttribute('aria-pressed', S.view==='all'); $('vFind').setAttribute('aria-pressed', S.view==='find'); $('vCal').setAttribute('aria-pressed', S.view==='cal');
  $('controls').hidden = !S.index.length; $('viewBar').hidden=!w;
  if(S.loading){ main.innerHTML='<div class="loading">Caricamento…</div>'; $('manage').hidden=true; return; }
  if(!w){
    $('title').innerHTML='Programma settimanale';
    main.innerHTML = '<div class="panel blank"><h2>Nessun programma caricato</h2><p class="hint">Carica il PDF delle attività settimanali (es. Attività_UMTEUD_42-2026.pdf). Viene diviso per giorno, turno e squadra e resta salvato insieme alle settimane precedenti.</p><button class="btn primary" type="button" data-act="upload">Carica PDF della settimana</button></div>';
    $('manage').hidden=true; return;
  }
  $('title').innerHTML = 'Settimana <span class="wk">'+w.settimana+'</span> <span style="font-weight:500;font-size:.6em;color:var(--muted)">'+esc(weekRange(w))+'</span>';
  if(S.dayIdx>=w.giorni.length) S.dayIdx=0;
  main.innerHTML = S.view==='mine'? renderMine(w) : S.view==='find' ? renderFind(w) : S.view==='cal' ? renderCal() : renderAll(w);
  if(S.view==='find'){ $('findQ').value=S.find.text; updateFind(); }
  $('manage').hidden = S.view==='cal'; if(S.view==='cal'){ $('title').innerHTML='Calendario'; calLoad(); }
  var when = w.caricatoIl ? new Date(w.caricatoIl) : null;
  $('metaLine').textContent = w.file? 'File: '+w.file+(when && !isNaN(when)?' · caricato il '+when.toLocaleDateString('it-IT'):'') : '';
}

// ---- caricamento dati dal Foglio ----
function openWeek(id){
  S.current=id;
  if(S.cache[id]){ var w=S.cache[id]; S.dayIdx=Math.max(0,todayIdx(w)); render(); return Promise.resolve(); }
  S.loading=true; render();
  return server('getWeek', id).then(function(txt){
    S.loading=false;
    if(txt){ var w=fixWeek(JSON.parse(txt)); S.cache[id]=w; S.dayIdx=Math.max(0,todayIdx(w)); }
    render();
  }).catch(function(e){ S.loading=false; setStatus('Non riesco a leggere la settimana: '+errMsg(e), true); render(); });
}
function loadIndex(selectId){
  return server('getIndex').then(function(txt){
    S.index = JSON.parse(txt||'[]');
    if(!S.index.length){ S.current=null; S.loading=false; render(); return; }
    var id = selectId;
    if(!id || !S.index.some(function(w){ return w.id===id; })){
      var now=isoWeek(new Date()); var nowId=now.year+'-'+('0'+now.week).slice(-2);
      id = S.index.some(function(w){ return w.id===nowId; }) ? nowId : S.index[0].id;
    }
    return openWeek(id);
  }).catch(function(e){ S.loading=false; setStatus('Non riesco a leggere il Foglio: '+errMsg(e), true); render(); });
}

// ---- eventi ----
document.addEventListener('click', function(e){
  if(calClick(e)) return;
  var f=e.target.closest('[data-addp],[data-rmp]');
  if(f){ if(f.dataset.addp){ if(S.find.people.indexOf(f.dataset.addp)<0) S.find.people.push(f.dataset.addp); } else { S.find.people=S.find.people.filter(function(p){ return p!==f.dataset.rmp; }); } updateFind(); return; }
  if(e.target.id==='findAdd'){ if(!findAddPerson($('findQ').value)) setStatus('Nessuna persona con questo nome in questa settimana.', true); else setStatus(''); return; }
  var t=e.target.closest('[data-day],[data-person],[data-act]'); if(!t) return;
  if(t.dataset.day!=null){ S.dayIdx=+t.dataset.day; render(); }
  else if(t.dataset.person){ setMe(t.dataset.person); S.view='mine'; lsSet('umte_view',S.view); render(); window.scrollTo(0,0); }
  else if(t.dataset.act==='upload') $('file').click();
  else if(t.dataset.act==='save') saveWeek();
  else if(t.dataset.act==='cancel'){ S.pending=null; $('previewBox').hidden=true; }
});
function setMe(p){ S.me=p; lsSet('umte_me',p); }
$('personSel').addEventListener('change', function(e){ setMe(e.target.value); render(); });
$('weekSel').addEventListener('change', function(e){ openWeek(e.target.value); });
$('vMine').addEventListener('click',function(){ S.view='mine'; lsSet('umte_view',S.view); render(); });
$('vAll').addEventListener('click',function(){ S.view='all'; lsSet('umte_view',S.view); render(); });
$('vFind').addEventListener('click',function(){ S.view='find'; lsSet('umte_view',S.view); render(); });
$('vCal').addEventListener('click',function(){ S.view='cal'; lsSet('umte_view',S.view); render(); });
document.addEventListener('change', function(e){ if(e.target.id==='calPsel'){ S.cal.p=e.target.value; S.cal.edit=null; render(); } });
document.addEventListener('input', function(e){ if(e.target.id==='findQ'){ var v=e.target.value; var w=cur(); if(w && people(w).indexOf(v)>=0){ findAddPerson(v); return; } S.find.text=v; updateFind(); } });
document.addEventListener('keydown', function(e){ if(e.target.id==='findQ' && e.key==='Enter'){ e.preventDefault(); findAddPerson(e.target.value); } });
$('uploadBtn').addEventListener('click',function(){ $('file').click(); });
$('delBtn').addEventListener('click',function(){ $('delBox').hidden=false; $('delBtn').hidden=true; $('delPw').value=lsGet('umte_pw'); $('delPw').focus(); });
$('delCancel').addEventListener('click',function(){ $('delBox').hidden=true; $('delBtn').hidden=false; });
$('delConfirm').addEventListener('click', function(){
  var w=cur(); if(!w) return; var pw=$('delPw').value; var id=weekId(w);
  setStatus('Eliminazione in corso…');
  server('deleteWeek', pw, id).then(function(){
    lsSet('umte_pw',pw); delete S.cache[id]; setStatus('Settimana '+w.settimana+' eliminata.');
    $('delCancel').click(); S.current=null; return loadIndex();
  }).catch(function(e){ setStatus(errMsg(e), true); if(/password/i.test(errMsg(e))) lsSet('umte_pw',''); });
});

$('file').addEventListener('change', function(e){
  var f=e.target.files[0]; e.target.value=''; if(!f) return;
  setStatus('Lettura del PDF in corso…');
  f.arrayBuffer().then(function(ab){
    return parseProgramma(window.pdfjsLib, new Uint8Array(ab));
  }).then(function(giorni){
    var nAtt = giorni.reduce(function(n,g){ return n+g.turni.reduce(function(m,t){ return m+t.attivita.length; },0); },0);
    if(!giorni.length || !nAtt) throw new Error('Non ho trovato la tabella Turno / Attività / OdL / Personale nel file. Controlla che sia il programma attività settimanale.');
    var m = f.name.match(/(\d{1,2})\s*[-_ ]\s*(20\d{2})/);
    var now = weekFromDays(giorni) || isoWeek(new Date());
    var week = { anno: m? +m[2] : now.year, settimana: m? +m[1] : now.week, file: f.name, caricatoIl: new Date().toISOString(), giorni: giorni };
    S.pending = { week: week, fromName: !!m };
    showPreview(); setStatus('');
  }).catch(function(err){ console.error(err); setStatus(errMsg(err)||'Il PDF non si è potuto leggere.', true); });
});
function showPreview(){
  var p=S.pending, w=p.week; var box=$('previewBox');
  var exists = S.index.some(function(x){ return x.id===weekId(w); });
  var savedPw = lsGet('umte_pw');
  box.innerHTML = '<h2>Programma letto</h2>'+
    '<div class="kv"><span>File <b>'+esc(w.file)+'</b></span><span><b>'+w.giorni.length+'</b> giorni</span><span><b>'+countAtt(w)+'</b> attività</span><span><b>'+people(w).length+'</b> persone</span></div>'+
    '<div class="bar" style="margin-bottom:10px">'+
      '<div class="field" style="flex:0 1 120px"><label for="pWeek">Settimana n.</label><input type="number" id="pWeek" min="1" max="53" value="'+w.settimana+'"></div>'+
      '<div class="field" style="flex:0 1 120px"><label for="pYear">Anno</label><input type="number" id="pYear" min="2020" max="2100" value="'+w.anno+'"></div>'+
      '<span class="hint" id="pRange" style="align-self:flex-end;padding-bottom:10px">'+esc(weekRange(w))+'</span>'+
    '</div>'+
    (p.fromName?'':'<div class="warn">Non ho trovato il numero di settimana nel nome del file: controllalo qui sopra.</div>')+
    '<div class="warn" id="pExists" '+(exists?'':'hidden')+'>Questa settimana è già salvata: verrà sostituita con il nuovo file.</div>'+
    '<div class="pwrow" id="pwRow" '+(savedPw?'hidden':'')+'><div class="field"><label for="pPw">Password per salvare</label><input type="password" id="pPw" autocomplete="current-password"></div></div>'+
    '<div class="bar"><button class="btn primary" type="button" data-act="save">Salva settimana</button><button class="btn" type="button" data-act="cancel">Annulla</button></div>';
  box.hidden=false;
  var upd=function(){ w.settimana=+$('pWeek').value||w.settimana; w.anno=+$('pYear').value||w.anno; $('pRange').textContent=weekRange(w); $('pExists').hidden=!S.index.some(function(x){ return x.id===weekId(w); }); };
  $('pWeek').addEventListener('input',upd); $('pYear').addEventListener('input',upd);
  box.scrollIntoView({block:'nearest'});
}
function saveWeek(){
  var w=S.pending.week;
  var pw = $('pwRow').hidden ? lsGet('umte_pw') : $('pPw').value;
  if(!pw){ $('pwRow').hidden=false; $('pPw').focus(); setStatus('Inserisci la password per salvare.', true); return; }
  setStatus('Salvataggio in corso…');
  server('saveWeek', pw, JSON.stringify(w)).then(function(id){
    lsSet('umte_pw', pw);
    S.cache[id]=fixWeek(w); S.pending=null; $('previewBox').hidden=true;
    setStatus('Settimana '+w.settimana+' salvata.');
    return loadIndex(id);
  }).catch(function(e){
    var m=errMsg(e);
    if(/password/i.test(m)){ lsSet('umte_pw',''); $('pwRow').hidden=false; $('pPw').value=''; $('pPw').focus(); }
    setStatus('Salvataggio non riuscito: '+m, true);
  });
}

// ---- installazione come app ----
var deferredPrompt=null;
var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function showInstall(text, withBtn){
  if(standalone || lsGet('umte_install_chiuso')) return;
  $('installText').textContent=text; $('installBtn').hidden=!withBtn; $('installBox').hidden=false;
}
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; showInstall("Installa l'app sul telefono per aprirla con un tocco, anche senza rete.", true); });
$('installBtn').addEventListener('click', function(){
  if(!deferredPrompt) return; deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt=null; $('installBox').hidden=true; });
});
$('installClose').addEventListener('click', function(){ $('installBox').hidden=true; lsSet('umte_install_chiuso','1'); });
window.addEventListener('appinstalled', function(){ $('installBox').hidden=true; });
if(isIOS && !standalone) showInstall('Per installarla su iPhone: tocca Condividi (il quadrato con la freccia) e poi "Aggiungi alla schermata Home".', false);
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
window.addEventListener('online', function(){ loadIndex(S.current); });

if(!apiConfigured()) setStatus('Manca il link del sito Apps Script: aprilo nel file config.js e incolla il link che finisce con /exec.', true);
render();
loadIndex();
})();
